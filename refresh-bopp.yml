name: Refresh BOPP Nong Khai Cache
on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * 0"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run refresh
      - name: Commit cache
        run: |
          git config user.name "bopp-cache-bot"
          git config user.email "bopp-cache-bot@users.noreply.github.com"
          git add data/cache.json
          git diff --cached --quiet || git commit -m "Refresh BOPP Nong Khai cache"
          git push
